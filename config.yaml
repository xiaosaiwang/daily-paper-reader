subscriptions:
  schema_migration:
    stage: A
    diff_threshold_pct: 15
  keyword_recall_mode: or
  intent_profiles:
    - tag: ag-bg-div
      description: 请帮我查找有关地上和地下功能多样性及其关系对生态系统功能影响的论文
      enabled: true
      paper_sources:
        - arxiv
        - biorxiv
      keywords:
        - keyword: soil nematode
          keyword_cn: ''
          query: 'n'
        - keyword: Tibetan Plateau
          keyword_cn: ''
          query: Tibetan Plateau
        - keyword: ecosystem function
          keyword_cn: ''
          query: e
        - keyword: aboveground functional diversity
          keyword_cn: 地上功能多样性
          query: aboveground functional diversity effects on ecosystem function
        - keyword: belowground functional diversity
          keyword_cn: 地下功能多样性
          query: belowground functional diversity effects on ecosystem function
        - keyword: aboveground-belowground interactions
          keyword_cn: 地上-地下相互作用
          query: interactions between aboveground and belowground functional diversity
      intent_queries:
        - query: >-
            What is the relative contribution of aboveground plant functional diversity, belowground soil biota
            functional diversity, and their cross trophic coupling (or asymmetry) to ecosystem multifunctionality, and
            how do these contributions shift along environmental gradients?
          query_cn: ''
          enabled: true
          source: manual
          note: ''
        - query: >-
            Are plant functional traits coordinated with soil microbial life history strategies and nematode functional
            traits across environmental gradients, and does the strength of this cross trophic trait coordination
            predict ecosystem multifunctionality?
          query_cn: ''
          enabled: true
          source: manual
          note: ''
        - query: >-
            How do climate gradients modulate the coupling between aboveground and belowground functional diversity and
            their joint effects on ecosystem function across large spatial scales?
          query_cn: ''
          enabled: true
          source: manual
          note: ''
        - query: >-
            How does the relationship between aboveground plant functional diversity and belowground soil microbial and
            nematode functional diversity drive ecosystem multifunctionality in grassland ecosystems?
          query_cn: ''
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-05-29T20:59:21.402Z'
